<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project page</title>
  <link rel="stylesheet" href="styling.css">
  <script src="index.js" defer></script>
</head>
<body class="locked">
  <div id="lock-overlay">
    <div id="lock-box">
      <h2>Enter your access code here.</h2>
      <p><i>Check your email.</i></p>
      <input id="password" type="password" placeholder="Password" autocomplete="off">
      <div class="btn-row">
        <button id="unlockBtn"><strong>Submit</strong></button>
        <button id="cancelBtn"><strong>Cancel</strong></button>
      </div>
      <div id="msg"></div>
    </div>
  </div>

  <div id="site-root">
    <h1>Welcome!</h1>
    <p>This website's in progress.</p>
  </div>

  <div id="theme-toggle">
    <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
  
    <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 0111.21 3 7 7 0 1012 21a9 9 0 009-8.21z"/>
    </svg>
  </div>

</body>
</html>
