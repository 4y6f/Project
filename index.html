<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cirra</title>
  <link rel="stylesheet" href="/styling.css">
  <script src="/index.js" defer></script>
</head>
<body class="locked">

  <!-- LOCK SCREEN -->
  <div id="lock-overlay">
    <div id="lock-box">
      <h2>Enter Access Code</h2>
      <input id="password" type="password" placeholder="Access Code" autocomplete="off">
      <div class="btn-row">
        <button id="unlockBtn">Submit</button>
        <button id="cancelBtn">Cancel</button>
      </div>
      <div id="msg"></div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <h1>Cirra</h1>
    <ul>
      <li><a href="/"><span>🏠</span> Home</a></li>
      <li><a href="/maps"><span>🗺️</span> Maps</a></li>
      <li><a href="/airports"><span>🛫</span> Airports</a></li>
      <li><a href="/flights"><span>✈️</span> Flights</a></li>
      <li><a href="/tips"><span>💡</span> Tips</a></li>
    </ul>
  </nav>

  <!-- MAIN CONTENT -->
  <main id="site-root">
    <section class="hero">
      <h2>Welcome to Cirra</h2>
      <p>Track flights, airports, and aviation info all in one place.</p>
      <div class="hero-buttons">
        <a href="/maps" class="btn">Maps</a>
        <a href="/airports" class="btn">Airports</a>
        <a href="/flights" class="btn">Flight Status</a>
      </div>
    </section>

    <section class="dashboard">
      <div class="card">📊 Flight Delays<br>Placeholder data</div>
      <div class="card">🛬 Popular Airports<br>Placeholder data</div>
      <div class="card">🗺️ Quick Map<br>Placeholder data</div>
    </section>
  </main>

</body>
</html>
