<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cirra</title>
  <link rel="stylesheet" href="styling.css">
  <script src="index.js" defer></script>
</head>
<body class="locked">
  <div id="lock-overlay">
    <div id="lock-box">
      <h2>Enter your access code</h2>
      <input id="password" type="password" placeholder="Access Code" autocomplete="off">
      <div class="btn-row">
        <button id="unlockBtn"><strong>Submit</strong></button>
        <button id="cancelBtn"><strong>Cancel</strong></button>
      </div>
      <div id="msg"></div>
    </div>
  </div>

  <div id="site-root">
    <aside id="sidebar">
      <button data-page="dashboard">Dashboard</button>
      <button data-page="flights">Flights</button>
      <button data-page="airports">Airports</button>
      <button data-page="maps">Maps</button>
      <button data-page="tips">Tips</button>
    </aside>

    <main>
      <header>
        <h1>Cirra</h1>
        <p>Your all-in-one wingman.</p>
      </header>

      <section id="cards">
        <div class="card">
          <h3>Flight Delays</h3>
          <div class="chart-placeholder">[Chart]</div>
        </div>
        <div class="card">
          <h3>Active Flights</h3>
          <div class="chart-placeholder">[Chart]</div>
        </div>
        <div class="card">
          <h3>Airports Status</h3>
          <div class="chart-placeholder">[Chart]</div>
        </div>
        <div class="card">
          <h3>Weather Overview</h3>
          <div class="chart-placeholder">[Chart]</div>
        </div>
      </section>

    </main>
  </div>
</body>
</html>
